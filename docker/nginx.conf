server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Explicit MIME map: the mirror contains fonts, manifests and modules that the
    # stock nginx image does not always know about.
    types {
        text/html                             html htm;
        text/css                              css;
        text/xml                              xml;
        text/vtt                              vtt;
        text/plain                            txt md;
        application/javascript                js mjs;
        application/json                      json map webmanifest;
        application/ld+json                   jsonld;
        application/manifest+json             webmanifest;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        application/pdf                       pdf;
        application/zip                       zip;
        application/wasm                      wasm;
        application/font-woff                 woff;
        application/font-woff2                woff2;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
        application/vnd.ms-fontobject         eot;
        application/octet-stream              bin 7z gz tar epub rar;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/webp                            webp;
        image/avif                            avif;
        image/svg+xml                         svg svgz;
        image/x-icon                          ico;
        image/bmp                             bmp;
        audio/mpeg                            mp3;
        audio/ogg                             oga ogg opus;
        audio/wav                             wav;
        video/mp4                             mp4;
        video/ogg                             ogv;
        video/webm                            webm;
    }

    sendfile        on;
    tcp_nopush      on;
    autoindex       off;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never expose dotfiles or editor leftovers.
    location ~ /\. {
        deny all;
    }
}