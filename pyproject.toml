[project]
name = "website-clone"
version = "0.1.0"
description = "Recursively clone a static website into a fully offline output/ directory, served by nginx."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "tldextract>=5.3",
]

[project.scripts]
sitecloner = "sitecloner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecloner"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "ty>=0.0.21",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "C4",  # comprehensions
    "PTH", # pathlib
]
ignore = [
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
